<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Roblox Player Card</title>
    <!-- Connect our CSS file (Costumes) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <!-- Avatar Picture -->
        <img id="avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Builderman" alt="Gamer Avatar">

        <!-- Player Info -->
        <h1 id="player-name">Builderman_10</h1>
        <p class="badge”>Web Dev Pro</p>

        <!-- Stats Section -->
        <div class="stats">
            <p>Level: <span id="level-num">1</span></p>
            <p>Coins: <span id="coin-num">100</span></p>
        </div>

        <!-- Interactive Button -->
        <button id="power-btn">⚡ Level Up!</button>
        
        <!-- Status Message -->
        <p id="status-text">Ready to play!</p>
    </div>

    <!-- Connect our JavaScript file (Scripts) -->
    <script src="script.js"></script>
</body>
</html>
